<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Mundo Mágico de Itzel - Juego Educativo</title>
    <!-- Tailwind CSS desde CDN para estilos modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hoja de estilos personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 text-white min-h-screen flex flex-col justify-between p-4 font-sans select-none">

    <!-- Cabecera del Juego: Información de Itzel -->
    <header class="bg-slate-900/80 backdrop-blur border border-purple-500/30 rounded-2xl p-4 shadow-2xl flex justify-between items-center max-w-md mx-auto w-full neon-border">
        <div>
            <h2 class="text-xs text-purple-300 font-semibold uppercase tracking-wider">Jugadora Estrella</h2>
            <h1 class="text-lg font-extrabold text-pink-400">👑 Itzel</h1>
            <p id="nivel-titulo" class="text-xs font-bold text-amber-400 neon-text-gold mt-0.5">🌟 Nivel 1: Cargando...</p>
        </div>
        <div class="text-right">
            <span class="text-xs text-indigo-300">Puntaje Total</span>
            <div id="score-display" class="text-xl font-extrabold text-emerald-400">0 XP</div>
        </div>
    </header>

    <!-- Contenedor Principal de Preguntas -->
    <main class="max-w-md mx-auto w-full my-auto space-y-4">
        
        <!-- Barra de Progreso del Nivel -->
        <div class="w-full bg-slate-950 rounded-full h-3 border border-indigo-800/80 p-0.5 shadow-inner">
            <div id="barra-exp" class="bg-gradient-to-r from-amber-400 to-emerald-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Tarjeta Interactiva del Juego -->
        <div id="game-card" class="bg-slate-900/90 border-2 border-indigo-600/50 rounded-3xl p-6 shadow-2xl text-center space-y-4 relative overflow-hidden backdrop-blur-md">
            
            <!-- Etiqueta de Categoría (Matemáticas o Lectura) -->
            <div>
                <span id="categoria-tag" class="bg-emerald-600 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider inline-block">
                    Cargando...
                </span>
            </div>
            
            <!-- Enunciado de la pregunta -->
            <p id="pregunta-texto" class="text-base font-semibold text-slate-100 min-h-[85px] flex items-center justify-center px-2 leading-relaxed">
                ¡Preparando el reto para Itzel!
            </p>

            <!-- Opciones de Respuesta en botones -->
            <div id="opciones-container" class="grid grid-cols-1 gap-3">
                <!-- Se inyectan dinámicamente desde js/app.js -->
            </div>
        </div>

        <!-- Mensaje de Feedback (Acierto o Error) -->
        <div id="feedback-msg" class="text-center font-bold text-base min-h-[30px] transition-all"></div>

    </main>

    <!-- Pie de Página -->
    <footer class="text-center text-xs text-purple-300/60 pb-2">
        Mundo Mágico de Itzel • Aprendizaje Móvil 🚀
    </footer>

    <!-- Carga ordenada de Scripts (Divide y Vencerás) -->
    <script src="datos/primaria.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
